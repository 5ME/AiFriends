name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: github-actions-test-key
      DJANGO_DEBUG: 'true'
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_NAME: aifriends
      PG_USER: postgres
      PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE aifriends_test;"
        env:
          PGOPTIONS: '-c client_min_messages=WARNING'

      - name: Run tests
        run: |
          mkdir -p backend/static
          cd backend
          python -m pytest web/tests/ -v

  # 前端单测：与后端 job 独立（无 Python 依赖，秒级完成）。
  # 加这个 job 的原因：聊天改版起前端开始有单测（Phase 4A 后 75 条），
  # 此前只在本地跑；CI 不跑会让它们悄悄腐烂（PR #42 评审 F5）。
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: npm run test:unit

      - name: Build (Vite + Tailwind)
        run: npm run build
