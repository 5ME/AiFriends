<h2>daisyUI Alert 内置图标</h2>
<p class="subtitle">4 种类型的内联 SVG 图标 — 不使用 emoji</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">alert-success</div>
    <div class="mockup-body" style="padding: 0.8rem;">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24" style="color: #22c55e;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p style="margin-top:0.3em;">✓ 勾选圆圈</p>

  </div>
  <div class="mockup">
    <div class="mockup-header">alert-error</div>
    <div class="mockup-body" style="padding: 0.8rem;">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24" style="color: #ef4444;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />

  </div>
</div>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">alert-warning</div>
    <div class="mockup-body" style="padding: 0.8rem;">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24" style="color: #f59e0b;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <p style="margin-top:0.3em;">⚠ 三角感叹号</p>
    </div>
  </div>
  <div class="mockup">
    <div class="mockup-header">alert-info</div>
    <div class="mockup-body" style="padding: 0.8rem;">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24" style="color: #3b82f6;">

  </div>
</div>

<div class="section" style="margin-top:1rem;">
  <p class="subtitle" style="font-size:0.85rem; opacity:0.6;">
