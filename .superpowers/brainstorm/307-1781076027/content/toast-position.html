<h2>Toast 通知应该出现在哪个位置？</h2>
<p class="subtitle">影响用户是否能看到通知，以及视觉习惯</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>右上角</h3>
      <p>传统通知位置，用户视觉焦点自然区域</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>顶部居中</h3>
      <p>最显眼，适合操作反馈，移动端友好</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>右下角</h3>
      <p>不遮挡主要内容，适合后台通知</p>
    </div>
  </div>
</div>
